[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nasa-space-apps-backend"
version = "0.1.0"
description = "API for body-region sensor measurements in microgravity research."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic[email]>=2.10,<3",
    "uvicorn>=0.34,<1",
    "pwdlib[argon2]>=0.3,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
